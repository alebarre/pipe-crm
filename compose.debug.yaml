services:
  prettier:
    image: prettier
    build:
      context: node_modules/.pnpm/prettier@3.9.6/node_modules/prettier
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: development
    ports:
      - 3000:3000
      - 9229:9229
    command: ["node", "--inspect=0.0.0.0:9229", "./index.cjs"]
